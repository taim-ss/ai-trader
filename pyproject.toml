[project]
name = "ai-trader"
version = "0.0.1"
description = "Educational AI trading agent: paper-first, risk-capped, calibrated. Not financial advice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "truststore>=0.10",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.50"]  # optional, Apache-2.0; the runner uses Yahoo's chart endpoint directly
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
